name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # O Android SDK já vem instalado nas máquinas do GitHub (ANDROID_HOME).
      - name: Compilar APK
        run: ./gradlew assembleRelease
      - name: Dar nome ao APK
        run: cp app/build/outputs/apk/release/*.apk Caderneta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Caderneta-apk
          path: Caderneta.apk
      # Em cada envio para o ramo main, publica o APK em "Releases" para descarregar no telemóvel.
      - name: Publicar versão
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSAO"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Caderneta.apk --clobber
          else
            gh release create "$TAG" Caderneta.apk --title "Caderneta $VERSAO" --notes "Descarregue Caderneta.apk no telemóvel Android e instale."
          fi
      # Envios para outros ramos: publica uma "prévia" para testar antes de juntar ao main.
      - name: Publicar prévia
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete previa --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create previa Caderneta.apk --prerelease --target "$GITHUB_SHA" --title "Prévia (${GITHUB_REF_NAME})" --notes "Versão de teste do ramo ${GITHUB_REF_NAME}."
